name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      # v7 for both: v4/v5 target Node 20, which GitHub deprecated and now
      # force-runs on Node 24 anyway, with a warning on every run. Pinned to a
      # major so patch fixes arrive without a version bump here. Both were
      # checked to declare `using: node24` rather than assumed from the tag.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The oldest Python this project claims to support, and the whole
          # point of running CI on it: a developer on a newer interpreter
          # cannot see a 3.11 syntax error locally. See
          # tests/test_python_compatibility.py.
          python-version: "3.11"

      # The test suite only exercises candidates/ and llm_pipeline/novel_condition_tester.py,
      # plus telegram/bot.py, which the message-chunking tests import. Deliberately
      # NOT the full requirements.txt: this avoids Freqtrade's native build
      # dependencies (TA-Lib) for a job that would never use them. pyarrow is needed
      # because test_run_battery.py reads the real historical parquet files (an
      # integration test, not a synthetic-data unit test); requests, anthropic and
      # python-dotenv are needed only because importing telegram/bot.py pulls them in
      # at module level -- no test makes a network call.
      #
      # This list going stale is a real failure mode, not a hypothetical one: CI was
      # red from 2026-08-29 to 2026-08-30 because the Telegram chunking tests were
      # added without it, and the four failures were invisible against a suite that
      # otherwise passed. ccxt is deliberately absent -- rather than install an
      # exchange client so that a string-chunking test can import telegram/bot.py,
      # the one call site that needed it now imports it lazily. If a future test
      # needs a heavy dependency, prefer making that import lazy over adding it here.
      - name: Install test dependencies
        run: pip install pandas numpy pytest pyarrow requests "anthropic<1.0" python-dotenv

      - name: Run tests
        run: python -m pytest tests/ -v
